<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 24" width="600" height="24" preserveAspectRatio="none">
  <defs>
    <pattern id="airmailStripes" width="36" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <!-- Terracotta Stripe -->
      <rect x="0" y="0" width="12" height="24" fill="#C3532B" opacity="0.85" />
      <!-- Parchment Gap -->
      <rect x="12" y="0" width="6" height="24" fill="transparent" />
      <!-- Muted Olive Stripe -->
      <rect x="18" y="0" width="12" height="24" fill="#3D463F" opacity="0.75" />
      <!-- Parchment Gap -->
      <rect x="30" y="0" width="6" height="24" fill="transparent" />
    </pattern>
  </defs>
  <rect width="100%" height="24" fill="url(#airmailStripes)" />
</svg>
