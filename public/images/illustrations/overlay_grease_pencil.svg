<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" aria-label="Analog Grease Pencil Annotations">
  <!-- Rough Wax Grease-Pencil Filter to mimic waxy analog crayon texture -->
  <defs>
    <filter id="greasePencilRoughness" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- =========================================================================
       GROUP 1: HAND-DRAWN EDITORIAL CIRCLE (Frame Highlight)
       ========================================================================= -->
  <g id="grease-circle" filter="url(#greasePencilRoughness)" stroke="#FF684D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Non-uniform double-loop hand-drawn circle -->
    <path d="M 180 140 C 130 160, 90 220, 95 280 C 100 350, 160 395, 240 390 C 320 385, 375 330, 370 250 C 365 170, 300 130, 220 135 C 160 140, 125 180, 115 230 C 105 285, 140 360, 210 375 C 275 390, 350 360, 365 300" />
    <!-- Editorial Checkmark or Star Accent -->
    <path d="M 375 160 L 390 180 L 420 145" stroke="#FFB93F" stroke-width="2.5" />
  </g>

  <!-- =========================================================================
       GROUP 2: ARCHIVAL CROP CORNERS (4 Corners Framing a Composition)
       ========================================================================= -->
  <g id="grease-crop-marks" filter="url(#greasePencilRoughness)" stroke="#FF684D" stroke-width="2.8" stroke-linecap="round" opacity="0.85">
    <!-- Top-Left Corner -->
    <path d="M 450 110 L 450 70 L 490 70" />
    <path d="M 442 70 L 448 70" stroke="#FFB93F" stroke-width="1.8" />

    <!-- Top-Right Corner -->
    <path d="M 710 70 L 750 70 L 750 110" />

    <!-- Bottom-Left Corner -->
    <path d="M 450 370 L 450 410 L 490 410" />

    <!-- Bottom-Right Corner -->
    <path d="M 710 410 L 750 410 L 750 370" />
  </g>

  <!-- =========================================================================
       GROUP 3: EDITORIAL SELECTION BRACKETS & REVISE ARROWS
       ========================================================================= -->
  <g id="grease-arrows-notes" filter="url(#greasePencilRoughness)" stroke="#FF684D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Curved Directional Annotation Arrow -->
    <path d="M 280 430 Q 340 480 440 470" />
    <path d="M 425 455 L 442 470 L 428 485" />

    <!-- Underline Squiggle -->
    <path d="M 480 480 Q 500 472 520 480 T 560 480 T 600 480 T 640 480 T 680 480" stroke="#FFB93F" stroke-width="2.2" />

    <!-- Editorial Margin Code -->
    <path d="M 720 150 L 740 180 L 760 150" stroke="#B7DB50" stroke-width="2" />
  </g>
</svg>

