<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- Archival Postal & Museum Seal -->
  <circle cx="160" cy="160" r="150" stroke="#C3532B" stroke-width="2.5" />
  <circle cx="160" cy="160" r="142" stroke="#C3532B" stroke-width="0.8" stroke-dasharray="3 3" />
  <circle cx="160" cy="160" r="105" stroke="#C3532B" stroke-width="1.5" />

  <!-- Circular Archival Typography Path -->
  <defs>
    <path id="sealTextPathUpper" d="M 40,160 A 120,120 0 1,1 280,160" />
    <path id="sealTextPathLower" d="M 280,160 A 120,120 0 0,1 40,160" />
  </defs>

  <text font-family="'Oswald', sans-serif" font-size="11" font-weight="600" letter-spacing="0.28em" fill="#C3532B">
    <textPath href="#sealTextPathUpper" startOffset="50%" text-anchor="middle">
      ECHOES · TEMPORAL ARCHIVE
    </textPath>
  </text>

  <text font-family="'Oswald', sans-serif" font-size="9" font-weight="600" letter-spacing="0.22em" fill="#3D463F">
    <textPath href="#sealTextPathLower" startOffset="50%" text-anchor="middle">
      INVIOLABLE DATE-LOCK · MMXXVI
    </textPath>
  </text>

  <!-- Center Hourglass & Monogram Symbol -->
  <g transform="translate(160, 160)" stroke="#C3532B" stroke-width="1.5" stroke-linecap="round" fill="none">
    <!-- Hourglass Outline -->
    <path d="M -18,-24 L 18,-24 L 0,0 L 18,24 L -18,24 L 0,0 Z" />
    <!-- Horizontal Caps -->
    <line x1="-24" y1="-24" x2="24" y2="-24" stroke-width="2" />
    <line x1="-24" y1="24" x2="24" y2="24" stroke-width="2" />
    <!-- Falling Sand Grains -->
    <circle cx="0" cy="8" r="1.5" fill="#C3532B" />
    <circle cx="0" cy="15" r="2" fill="#C3532B" />
    <!-- Flanking Stars -->
    <circle cx="-42" cy="0" r="2" fill="#D9883B" />
    <circle cx="42" cy="0" r="2" fill="#D9883B" />
  </g>
</svg>
