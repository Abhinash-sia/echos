<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" fill="none" aria-label="35mm Film Negative Sprocket Strip">
  <defs>
    <!-- Single 35mm Sprocket Hole: 24px wide x 34px high with 4px corner radius -->
    <pattern id="sprocketPatternTop" x="0" y="0" width="48" height="64" patternUnits="userSpaceOnUse">
      <rect x="12" y="15" width="24" height="34" rx="5" fill="#0E0F17" stroke="#33374E" stroke-width="1" />
    </pattern>

    <pattern id="sprocketPatternBottom" x="0" y="0" width="48" height="64" patternUnits="userSpaceOnUse">
      <rect x="12" y="15" width="24" height="34" rx="5" fill="#0E0F17" stroke="#33374E" stroke-width="1" />
    </pattern>

    <!-- Film Base Dark Acetate with Mask for Windows -->
    <mask id="filmFrameWindowsMask">
      <!-- Opaque base allows everything -->
      <rect x="0" y="0" width="1600" height="480" fill="#FFFFFF" />

      <!-- Top and Bottom Sprocket Cutouts -->
      <!-- Frame 1 Window Cutout (x: 60, y: 70, width: 440, height: 340) -->
      <rect x="60" y="70" width="440" height="340" rx="4" fill="#000000" />

      <!-- Frame 2 Window Cutout (x: 580, y: 70, width: 440, height: 340) -->
      <rect x="580" y="70" width="440" height="340" rx="4" fill="#000000" />

      <!-- Frame 3 Window Cutout (x: 1100, y: 70, width: 440, height: 340) -->
      <rect x="1100" y="70" width="440" height="340" rx="4" fill="#000000" />
    </mask>
  </defs>

  <!-- =========================================================================
       1. MAIN ACETATE BASE (Dark Charcoal with 3 Cutout Windows)
       ========================================================================= -->
  <rect x="0" y="0" width="1600" height="480" fill="#141522" mask="url(#filmFrameWindowsMask)" />

  <!-- Frame Window Inner Hairline Borders -->
  <rect x="59.5" y="69.5" width="441" height="341" rx="4" stroke="#25273C" stroke-width="1" fill="none" />
  <rect x="579.5" y="69.5" width="441" height="341" rx="4" stroke="#25273C" stroke-width="1" fill="none" />
  <rect x="1099.5" y="69.5" width="441" height="341" rx="4" stroke="#25273C" stroke-width="1" fill="none" />

  <!-- =========================================================================
       2. SPROCKET PERFORATIONS (TOP & BOTTOM MARGINS)
       ========================================================================= -->
  <!-- Top Sprocket Track -->
  <rect x="0" y="0" width="1600" height="64" fill="url(#sprocketPatternTop)" />
  <line x1="0" y1="64" x2="1600" y2="64" stroke="#25273C" stroke-width="1" />

  <!-- Bottom Sprocket Track -->
  <g transform="translate(0, 416)">
    <line x1="0" y1="0" x2="1600" y2="0" stroke="#25273C" stroke-width="1" />
    <rect x="0" y="0" width="1600" height="64" fill="url(#sprocketPatternBottom)" />
  </g>

  <!-- =========================================================================
       3. AMBER & COBALT ARCHIVAL TEXT MARKINGS
       ========================================================================= -->
  <g font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#FFB93F" opacity="0.85" letter-spacing="1.5">
    <!-- Top Edge Markings -->
    <text x="70" y="60">ECHOES SAFETY FILM 400</text>
    <text x="360" y="60">· · · ISO 400/27° · · ·</text>
    <text x="590" y="60">ECHOES SAFETY FILM 400</text>
    <text x="880" y="60">ARCHIVE 2026</text>
    <text x="1110" y="60">ECHOES SAFETY FILM 400</text>
    <text x="1400" y="60">BATCH № 09B</text>

    <!-- Bottom Edge Frame Numerals & Indicators -->
    <g transform="translate(0, 428)">
      <!-- Frame 01 -->
      <text x="70" y="0" fill="#FF684D">▶ 01A</text>
      <text x="240" y="0" font-size="8" fill="#F7D84B">REF № 2026.10-A</text>
      <text x="460" y="0" fill="#FF684D">01A</text>

      <!-- Frame 02 -->
      <text x="590" y="0" fill="#FF684D">▶ 02A</text>
      <text x="760" y="0" font-size="8" fill="#F7D84B">REF № 2026.10-B</text>
      <text x="980" y="0" fill="#FF684D">02A</text>

      <!-- Frame 03 -->
      <text x="1110" y="0" fill="#FF684D">▶ 03A</text>
      <text x="1280" y="0" font-size="8" fill="#F7D84B">REF № 2026.10-C</text>
      <text x="1500" y="0" fill="#FF684D">03A</text>
    </g>
  </g>

  <!-- Frame Dividing Vertical Separators -->
  <g stroke="#33374E" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7">
    <line x1="540" y1="64" x2="540" y2="416" />
    <line x1="1060" y1="64" x2="1060" y2="416" />
  </g>

  <!-- Decorative Optical Barcode Ticks between frames -->
  <g fill="#D49A3D" opacity="0.5">
    <!-- Between frame 1 and 2 -->
    <rect x="526" y="160" width="2" height="40" />
    <rect x="531" y="160" width="4" height="40" />
    <rect x="538" y="160" width="1" height="40" />
    <rect x="542" y="160" width="3" height="40" />
    <rect x="548" y="160" width="2" height="40" />
    <!-- Between frame 2 and 3 -->
    <rect x="1046" y="160" width="2" height="40" />
    <rect x="1051" y="160" width="4" height="40" />
    <rect x="1058" y="160" width="1" height="40" />
    <rect x="1062" y="160" width="3" height="40" />
    <rect x="1068" y="160" width="2" height="40" />
  </g>
</svg>

